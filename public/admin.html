<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<nav>
  <a class="nav-brand" href="admin.html">
    <div class="nav-logo">YS</div>
    <span class="nav-title">Intern Task Tracker</span>
  </a>
  <div class="nav-links">
    <a href="admin.html" class="active"><i class="fa fa-dashboard"></i> Dashboard</a>
    <!-- Track option removed for Admin -->
    <a href="#" onclick="logout()" class="btn-nav"><i class="fa fa-sign-out-alt"></i> Logout</a>
  </div>
</nav>

<div class="container" style="max-width:1100px">
  <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px">
    <div class="card" style="text-align:center; padding:20px">
      <div style="font-size:32px; font-weight:700; color:#1a73e8" id="total-count">0</div>
      <div style="font-size:13px; color:#666; margin-top:4px">Total Submissions</div>
    </div>
    <div class="card" style="text-align:center; padding:20px">
      <div style="font-size:32px; font-weight:700; color:#f9ab00" id="pending-count">0</div>
      <div style="font-size:13px; color:#666; margin-top:4px">Pending</div>
    </div>
    <div class="card" style="text-align:center; padding:20px">
      <div style="font-size:32px; font-weight:700; color:#34a853" id="approved-count">0</div>
      <div style="font-size:13px; color:#666; margin-top:4px">Approved</div>
    </div>
    <div class="card" style="text-align:center; padding:20px">
      <div style="font-size:32px; font-weight:700; color:#ef4444" id="rejected-count">0</div>
      <div style="font-size:13px; color:#666; margin-top:4px">Rejected</div>
    </div>
  </div>

  <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px">
    <div class="card">
      <h3 style="font-size:15px; margin-bottom:16px">Status breakdown</h3>
      <canvas id="pieChart" height="200"></canvas>
    </div>
    <div class="card">
      <h3 style="font-size:15px; margin-bottom:16px">Daily submissions (7 days)</h3>
      <canvas id="barChart" height="200"></canvas>
    </div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px">
      <h2 style="font-size:18px">All Submissions</h2>
      <button class="btn btn-success btn-sm" onclick="exportCSV()">
        <i class="fa fa-download"></i> Export CSV
      </button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Intern ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Task</th>
            <th>Link</th>
            <th>Status</th>
            <th>Submitted</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="submissions-table">
          <tr><td colspan="8" style="text-align:center; color:#999; padding:24px">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script type="module" src="admin.js"></script>
</body>
</html>
